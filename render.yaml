# Render Blueprint — the Express API, hosted on Render. The React frontend is
# deployed separately on Vercel and calls this API origin via VITE_API_URL.
# This service is API-ONLY: it does not build or serve the client (server.js
# only activates its static-client block when SERVE_CLIENT=1).
#
# To deploy:
#   1. Ensure this file is pushed to GitHub (repo: HKRAmarSingh19/my-portfolio).
#   2. Render > New > Blueprint, connect that repo. It creates the service below.
#   3. After creation, open the service > Environment and fill the vars:
#      REQUIRED:
#        MONGODB_URI          (your Atlas connection string)
#        JWT_SECRET           (long random string, >= 16 chars — server refuses
#                              to boot without it)
#        ALLOWED_ADMIN_EMAILS (comma-separated Google emails allowed to sign in)
#        CLIENT_URL           (the VERCEL frontend origin, e.g. https://xx.vercel.app —
#                              used for CORS and as the Google OAuth redirect)
#      OPTIONAL (only if you use the feature):
#        GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URI, AWS_*,
#        INSTAGRAM_*, LINKEDIN_VANITY_NAME.
#   4. Manual Deploy > Clear build cache & deploy. Check /api/health.

services:
  - type: web
    name: portfolio-api
    runtime: node
    rootDir: .
    plan: free
    healthCheckPath: /api/health

    # This service is the API ONLY — the React frontend is hosted separately on
    # Vercel and calls this origin (VITE_API_URL). So the build installs just the
    # server (and the root workspace) and does NOT build client/dist. The server
    # skips its static-client block because SERVE_CLIENT is not set.
    buildCommand: npm install && npm install --prefix server

    # `npm start` -> `npm start --prefix server` -> node server.js.
    # Render sets NODE_ENV=production and PORT automatically.
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 24h
      # Do NOT set SERVE_CLIENT — this service is API-only (frontend is on Vercel).

      # ---- Secrets / Config — left empty on purpose so they are never
      # committed; you fill them in the dashboard (service > Environment)
      # before the first successful deploy. `sync: false` stops Render from
      # overwriting the values you enter.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ADMIN_EMAILS
        sync: false
      - key: CLIENT_URL
        sync: false

      # ---- Optional secrets (leave empty unless you use the feature).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_GRAPH_API_VERSION
        sync: false
      - key: LINKEDIN_VANITY_NAME
        sync: false
