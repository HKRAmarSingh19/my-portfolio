# Render Blueprint — a single Web Service runs the Express API and serves the
# built React client from the same origin (server.js serves client/dist and
# falls back to index.html for SPA routes in production, so there is one URL
# and no CORS config to maintain).
#
# To deploy:
#   1. Ensure this file is pushed to GitHub (repo: HKRAmarSingh19/my-portfolio).
#   2. Render > New > Blueprint, connect that repo. It creates the service below.
#   3. After creation, open the service > Environment and fill the three
#      REQUIRED secret vars (they ship empty on purpose — never commit them):
#        MONGODB_URI          (your Atlas connection string)
#        JWT_SECRET           (long random string, >= 16 chars — server refuses
#                              to boot without it)
#        ALLOWED_ADMIN_EMAILS (comma-separated Google emails allowed to sign in)
#   4. Add optional vars if you use them: CLIENT_URL (your .onrender.com URL once assigned),
#      GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URI, AWS_*, etc.
#   5. Manual Deploy > Clear build cache & deploy. Check /api/health.

services:
  - type: web
    name: portfolio-api
    runtime: node
    rootDir: .
    plan: free
    healthCheckPath: /api/health

    # Install root + server + client dependencies, then build the React client
    # into client/dist (server.js serves it in production).
    #
    # The client build tool (vite, tailwind, ...) lives in client/DEVdependencies,
    # which a plain `npm install --prefix client` would SKIP because Render runs
    # the build under NODE_ENV=production. We add `--include=dev` to the client
    # install so those build tools are present; the explicit chain (rather than
    # the root install:all script) makes clear --include=dev only targets the
    # client, where it is needed.
    buildCommand: npm install && npm install --prefix server && npm install --prefix client --include=dev && npm run build

    # `npm start` -> `npm start --prefix server` -> node server.js.
    # Render sets NODE_ENV=production and PORT automatically.
    startCommand: npm start

    envVars:
      # Production NODE_ENV enables the static-client + SPA fallback in server.js.
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 24h

      # ---- Secrets / Config — left empty on purpose so they are never
      # committed; you fill them in the dashboard (service > Environment)
      # before the first successful deploy. `sync: false` stops Render from
      # overwriting the values you enter.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ADMIN_EMAILS
        sync: false
      - key: CLIENT_URL
        sync: false

      # ---- Optional secrets (leave empty unless you use the feature).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_GRAPH_API_VERSION
        sync: false
      - key: LINKEDIN_VANITY_NAME
        sync: false
